<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回声 Agent · 服务形态控制台</title>
<style>
  :root {
    --ink: #111214; --sub: #6E7378; --mute: #9AA0A6;
    --line: #EBECEE; --line-2: #DEDFE2; --bg: #FBFBFC;
    --green: #0F7B5F; --amber: #8A6100; --red: #B3261E; --blue: #2A5CDB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.65;
    height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  header {
    flex: 0 0 58px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .tag { font-size: 12px; color: var(--mute); }
  main { flex: 1; display: flex; min-height: 0; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 24px 28px 8px; }
  .row { max-width: 78%; margin-bottom: 14px; }
  .row.user { margin-left: auto; }
  .bubble { padding: 11px 15px; border-radius: 14px; border: 1px solid var(--line); background: #fff; }
  .row.user .bubble { background: var(--ink); color: #fff; border-color: var(--ink); }
  .badge {
    display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; border: 1px solid var(--line-2); color: var(--sub);
  }
  .badge.green { color: var(--green); border-color: #CFE6DE; background: #F1F7F4; }
  .badge.yellow { color: var(--amber); border-color: #F0E3C4; background: #FBF6E9; }
  .badge.red { color: var(--red); border-color: #F2D9D6; background: #FDF3F2; }
  .confirm { margin-top: 8px; }
  .confirm button {
    padding: 7px 16px; margin-right: 8px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line-2); background: #fff; font-size: 13px;
  }
  .confirm button.ok { background: var(--ink); color: #fff; border-color: var(--ink); }
  #input-area { border-top: 1px solid var(--line); background: #fff; padding: 12px 28px 16px; display: flex; gap: 10px; }
  #text {
    flex: 1; padding: 11px 15px; border: 1px solid var(--line-2); border-radius: 12px;
    font-size: 14px; outline: none;
  }
  #text:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,18,20,.06); }
  #send { padding: 11px 22px; border: none; border-radius: 12px; background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; }
  aside {
    width: 420px; flex: 0 0 420px; border-left: 1px solid var(--line); background: #fff;
    padding: 20px 22px; display: flex; flex-direction: column; min-height: 0;
  }
  aside h2 { font-size: 11px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--mute); margin-bottom: 10px; }
  pre {
    flex: 1; overflow: auto; background: #FAFAFB; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font-size: 11.5px; line-height: 1.7;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #2B2D31;
  }
  .hint { font-size: 11px; color: var(--mute); margin-top: 10px; line-height: 1.7; }
  @media (max-width: 900px) { main { flex-direction: column; } aside { width: 100%; flex: 0 0 40vh; border-left: none; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>回声 Agent · 服务形态控制台</h1>
  <span class="tag">开发者视角 ｜ 与 app/index.html 共用同一份内核</span>
</header>

<main>
  <div id="chat">
    <div id="log"></div>
    <div id="input-area">
      <input id="text" placeholder="例如：转给小王 5000 元 / 帮我看看余额 / 我卡好像丢了" autofocus>
      <button id="send" onclick="send()">发送</button>
    </div>
  </div>
  <aside>
    <h2>结构化返回（/chat）</h2>
    <pre id="json">等待第一次请求……</pre>
    <div class="hint">
      这一栏是服务端返回的原始 JSON：level / hits / reply / pending / audit。<br>
      老人端（index.html）是单文件离线版；这里是服务形态，两者共用同一内核。
    </div>
  </aside>
</main>

<script>
const session = "demo-" + Math.random().toString(36).slice(2, 8);
let pending = null;

function el(tag, cls, text) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
}

function addRow(role, text, level) {
  const row = el("div", "row " + role);
  row.appendChild(el("div", "bubble", text));
  if (level) {
    const badge = el("span", "badge " + level, level === "green" ? "🟢 自动执行" : level === "yellow" ? "🟡 需确认" : level === "red" ? "🔴 已拦截" : level);
    row.appendChild(badge);
  }
  document.getElementById("log").appendChild(row);
  document.getElementById("log").scrollTop = 1e9;
  return row;
}

async function post(path, payload) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload),
  });
  return res.json();
}

async function send() {
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addRow("user", text);

  let data;
  try {
    data = await post("/chat", { text, session });
  } catch (err) {
    addRow("agent", "服务没连上。请先运行：node scripts/agent_server.mjs 8792");
    return;
  }
  document.getElementById("json").textContent = JSON.stringify(data, null, 2);

  if (!data.ok) {
    addRow("agent", "服务返回异常：" + (data.reason || "unknown"));
    return;
  }
  const row = addRow("agent", data.reply || "（无回复）", data.level);
  pending = data.pending;

  if (pending) {
    const box = el("div", "confirm");
    const ok = el("button", "ok", "确认执行");
    const no = el("button", "", "取消");
    ok.onclick = () => decide(true);
    no.onclick = () => decide(false);
    box.append(ok, no);
    row.appendChild(box);
  }
}

async function decide(approve) {
  const data = await post("/confirm", { approve, session });
  document.getElementById("json").textContent = JSON.stringify(data, null, 2);
  addRow("agent", data.reply || (approve ? "已执行" : "已取消"));
  pending = null;
}

document.getElementById("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

addRow("agent", "服务已就绪。可以试：帮我看看余额 / 转给小王 5000 元 / 三个人 AA 一共 300 元。");
</script>
</body>
</html>
